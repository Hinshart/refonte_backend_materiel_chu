services:
  - type: web
    name: chu-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      npm install
      npx prisma generate
      npx prisma migrate deploy
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: SALT_ROUNDS
        value: 10
      - key: CORS_ORIGIN
        sync: false   # à définir manuellement dans le dashboard Render
      - key: DATABASE_URL
        fromDatabase:
          name: chu-postgres
          property: connectionString

databases:
  - name: chu-postgres
    plan: free
    region: frankfurt
    databaseName: chu_materiel
    user: chu